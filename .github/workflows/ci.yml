name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etl_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d etl_warehouse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-etl .

      - name: Run tests
        run: >
          docker run --rm --network host
          -e STRIPE_API_KEY=test_key
          -e DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/etl_warehouse
          enterprise-etl
